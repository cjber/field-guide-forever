# Sloppatrol profile for Field Guide Forever, a WoW: Forever addon in Lua 5.1 with Python tooling.
# The checks are the fast ones from AGENTS.md, set by hand: the repo has no package.json to infer them from.
agent: claude
prepare: []
cleanup: [stylua .]
checks:
  - { name: format, run: "stylua --check ." }
  - { name: lint, run: "luacheck ." }
  - { name: typecheck, run: "bash tools/typecheck.sh" }
  - { name: specs, run: "for s in tests/*_spec.lua; do luajit \"$s\" || exit 1; done", tests: true }
  - { name: tools, run: "ruff format --check tools && ruff check tools" }
  - { name: audit, run: "python3 tools/visual_audit.py" }
  # check_screenshots.py is left out: it hashes Core/ and UI/, so any refactor there fails it until
  # tools/screenshots.py re-renders, which needs forever-core and Pillow that a run checkout lacks.
  - { name: rules, run: "python3 tools/repo_rules.py" }
focus: [Core/**, UI/**, Integrations/**]
ignore: [Data/**, Locales/**, Libs/**, tools/forever_tools/**]
guards: { maxFiles: 8, maxLines: 400 }
