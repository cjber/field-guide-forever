name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deadcode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tools/deadcode.py --check

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT and luacheck
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
          LUACHECK: 1.1.2-1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT" "lua-check=$LUACHECK"
      - run: luacheck .
      - run: python3 -m tools.forever_tools.assets
      - run: for spec in tests/*_spec.lua; do luajit "$spec" || exit 1; done
      # A screenshot older than the code it is drawn from (docs/screenshots/scenes.sha256).
      - run: python3 tools/check_screenshots.py
      # The rendered layout: every widget inside the frame, no overlap, no bleed past the edge.
      - run: pip install pillow==12.2.0 && python3 tools/visual_audit.py
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx ruff@0.16.8 check tools
      - run: uvx ruff@0.16.8 format --check tools
      # Pillow is local-only for the renderer, so tools/ carries `ty: ignore[unresolved-import]` on those imports.
      - run: uvx ty@0.0.83 check tools --extra-search-path . --extra-search-path tools

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LuaLS 3.19.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/luals.tar.gz" https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz
          echo "e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8  $RUNNER_TEMP/luals.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/luals"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
      - run: bash tools/typecheck.sh

  # Data/Client.lua and Data/CreatureIcons.lua are generated and hand-editing them is forbidden, so this job
  # regenerates both in a scratch tree from the pinned sources and fails on stale, byte-unstable or unlisted output.
  # tools/.cache starts empty on a cold runner and the generator downloads the sha256-pinned inputs itself; the
  # cache below only saves the download on later runs, keyed by every tool that shapes the cached inputs: the
  # generators that carry the pins, and the extractor that writes the QuestieDB fixture's columns.
  generated-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache
          key: regeneration-${{ runner.os }}-${{ hashFiles('tools/gen_*.py', 'tools/extract_*.lua') }}
          restore-keys: regeneration-${{ runner.os }}-
      # gen_creature_icons.py builds its QuestieDB fixture with gen_mock_catalogue.py, which shells out to luajit.
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT"
      - name: Regenerate the shipped data in a scratch tree
        run: python3 tools/check_generated.py

  # The repository's own rules, on every push and pull request.
  project-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release publishes its changelog entry, so every tagged version needs one.
      - run: python3 tools/changelog.py --check
      - run: python3 tools/repo_rules.py

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor@1.30.1 --offline .github

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner .

  # What a tag would ship, checked before it ships: the release workflow's packager without uploading or zipping,
  # then tools/check_package.py on .release/ (every file the TOC loads, no development folders).
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # .pkgmeta's manual changelog, which the release fills with the version's entry.
      - run: printf 'Package check\n' > .release-notes.md
      # The packager skips a push build when HEAD carries a tag ("Found future tag, not packaging"), so a tag that
      # lands while this run is in flight would fail this job and leave main without the green run a release starts
      # from. This job checks what a tag would ship, so hide HEAD's tags and let the dry run build what an ordinary
      # push to main builds.
      - name: Package this commit as an untagged build
        run: git tag --points-at HEAD | xargs -r git tag --delete
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d -z
      - run: python3 tools/check_package.py
