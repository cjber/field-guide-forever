name: Refresh client data

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.pr.outputs.pull-request-branch }}
      operation: ${{ steps.pr.outputs.pull-request-operation }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: "3.12"
      - name: Regenerate the current Forever client constants
        run: |
          build=$(python3 -c 'import sys;sys.path.insert(0,"tools");from forever_tools.latest_build import latest;print(latest("FieldGuideForever refresh workflow"))')
          python3 tools/gen_zones.py --build "$build"
      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/refresh-client-data
          delete-branch: true
          title: "data: refresh client constants"
          commit-message: "data: refresh client constants"
          body: "Automated refresh of pinned WoW Forever client constants from wago.tools."

  ci:
    needs: refresh
    if: needs.refresh.outputs.operation == 'created' || needs.refresh.outputs.operation == 'updated'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.refresh.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  # One open "Data refresh failed" issue: a scheduled run that fails again when retry-refresh.yml re-runs it
  # opens it or adds to it, and the next run that passes closes it. The first attempt stays quiet because
  # retry-refresh.yml re-runs it first. ci is skipped when the refresh never opened a PR, so this job reads
  # both results explicitly instead of relying on the default needs rule.
  report:
    needs: [refresh, ci]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Data refresh failed
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ "$FAILED" = true ] && [ "$RUN_ATTEMPT" = 1 ]; then
            echo "retry-refresh.yml re-runs this once; only a failed re-run is reported"
          elif [ "$FAILED" = true ]; then
            body="The scheduled data refresh failed: $RUN_URL

          If the client build moved but the refresh could not open its PR, this repository is missing the Actions permission that lets a workflow create a pull request, so the bundled client data in Data/Client.lua and the refresh branch stay as they were and the bundled data may be behind the client players run. Creating the PR needs the repository setting enabled by the owner; no workflow change can grant it.

          Read the error in that run for anything else. The next scheduled run that passes closes this issue."
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "The refresh passed again: $RUN_URL"
          fi
