name: Refresh client data

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      branch: ${{ steps.pr.outputs.pull-request-branch }}
      operation: ${{ steps.pr.outputs.pull-request-operation }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # tools/gen_zones.py's BUILD pins generated data, tools/check_generated.py and tests/data_spec.lua.
      # Screenshot art uses the separate reviewed UI-art pin in tools/ui_art.py.
      - name: Pin the newest Forever build
        id: build
        run: |
          build=$(python3 -c 'import sys;sys.path.insert(0,"tools");from forever_tools.latest_build import latest;print(latest("FieldGuideForever refresh workflow"))')
          echo "version=$build" >> "$GITHUB_OUTPUT"
          if grep -q "^BUILD = \"$build\"" tools/gen_zones.py; then
            echo "already on $build"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^BUILD = \".*\"/BUILD = \"$build\"/" tools/gen_zones.py
      - if: steps.build.outputs.new == 'true'
        run: python3 tools/gen_zones.py
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT
        if: steps.build.outputs.new == 'true'
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
        run: |
          # Fall back to a mirror of Ubuntu's signed archives when the runner's Azure mirror cannot resolve.
          mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_list" ] && ! getent ahosts azure.archive.ubuntu.com >/dev/null; then
            printf '%s\n' https://mirrors.mit.edu/ubuntu | sudo tee "$mirror_list" >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT"
      - if: steps.build.outputs.new == 'true'
        name: Read the Forever Core ref
        id: forever-core
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - if: steps.build.outputs.new == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core.outputs.ref }}
          path: forever-core
          persist-credentials: false
      - if: steps.build.outputs.new == 'true'
        env:
          FOREVER_CORE: forever-core
        run: |
          python3 -m tools.forever_tools.specs
      - if: steps.build.outputs.new == 'true'
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: automation/refresh-client-data
          delete-branch: true
          title: "data: client constants for Forever ${{ steps.build.outputs.version }}"
          commit-message: "data: client constants for Forever ${{ steps.build.outputs.version }}"
          body: "Regenerated `Data/Client.lua` from the wago.tools DB2 exports of Forever build ${{ steps.build.outputs.version }}, with the build pin in `tools/gen_zones.py` moved to match."

  ci:
    needs: refresh
    if: needs.refresh.outputs.operation == 'created' || needs.refresh.outputs.operation == 'updated'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.refresh.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  # One open "Data refresh failed" issue: a scheduled run that fails again when retry-refresh.yml re-runs it
  # opens it or adds to it, and the next run that passes closes it. The first attempt stays quiet because
  # retry-refresh.yml re-runs it first. ci is skipped when the refresh never opened a PR, so this job reads
  # both results explicitly instead of relying on the default needs rule.
  report:
    needs: [refresh, ci]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Data refresh failed
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ "$FAILED" = true ] && [ "$RUN_ATTEMPT" = 1 ]; then
            echo "retry-refresh.yml re-runs this once; only a failed re-run is reported"
          elif [ "$FAILED" = true ]; then
            body="The scheduled data refresh failed: $RUN_URL

          If the client build moved but the refresh could not open its PR, this repository is missing the Actions permission that lets a workflow create a pull request, so the bundled client data in Data/Client.lua and the refresh branch stay as they were and the bundled data may be behind the client players run. Creating the PR needs the repository setting enabled by the owner; no workflow change can grant it.

          Read the error in that run for anything else. The next scheduled run that passes closes this issue."
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "The refresh passed again: $RUN_URL"
          fi
